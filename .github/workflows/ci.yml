name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest tests/ -v --tb=short -x

      - name: Benchmark (simulate)
        run: python benchmarks/iupac_bench.py --simulate

  boundary-checks:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cross-language boundary checks (numpy <-> JAX)
        env:
          JAX_PLATFORM_NAME: cpu
          PYTHONHASHSEED: "0"
        run: |
          pytest tests/test_boundary_numpy_jax.py -v --tb=short \
            -p no:randomly --override-ini="addopts=" \
            2>&1 | tee boundary_report.txt
          grep -E "passed|failed|error" boundary_report.txt

      - name: Upload boundary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-report
          path: boundary_report.txt

  silent-wrong-result-checks:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Silent wrong-result checks
        env:
          JAX_PLATFORM_NAME: cpu
          PYTHONHASHSEED: "0"
        run: |
          pytest tests/test_silent_wrong_results.py -v --tb=long \
            -p no:randomly --override-ini="addopts=" \
            2>&1 | tee silent_wrong_report.txt
          grep -E "passed|failed|error" silent_wrong_report.txt

      - name: Upload silent-wrong report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silent-wrong-report
          path: silent_wrong_report.txt

  data-corruption-checks:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Data corruption checks
        env:
          JAX_PLATFORM_NAME: cpu
          PYTHONHASHSEED: "0"
        run: |
          pytest tests/test_data_corruption.py -v --tb=long \
            -p no:randomly --override-ini="addopts=" \
            2>&1 | tee data_corruption_report.txt
          grep -E "passed|failed|error" data_corruption_report.txt

      - name: Upload data-corruption report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-corruption-report
          path: data_corruption_report.txt

  crash-checks:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Crash and exception-boundary checks
        env:
          JAX_PLATFORM_NAME: cpu
          PYTHONHASHSEED: "0"
        run: |
          pytest tests/test_crashes.py -v --tb=short \
            -p no:randomly --override-ini="addopts=" \
            2>&1 | tee crash_report.txt
          grep -E "passed|failed|error" crash_report.txt

      - name: Upload crash report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-report
          path: crash_report.txt

  type-and-style-checks:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Runtime type-contract checks
        env:
          JAX_PLATFORM_NAME: cpu
          PYTHONHASHSEED: "0"
        run: |
          pytest tests/test_type_contracts.py -v --tb=short \
            -p no:randomly --override-ini="addopts=" \
            2>&1 | tee type_contract_report.txt
          grep -E "passed|failed|error" type_contract_report.txt

      - name: Static type check (mypy)
        run: python scripts/mypy_check.py

      - name: Upload type-contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: type-contract-report
          path: type_contract_report.txt

  determinism-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: BioactivityRewardTrainer.train is deterministic and does not mutate global numpy rng
        env:
          JAX_PLATFORM_NAME: cpu
          PYTHONHASHSEED: "0"
        run: |
          python - <<'PYEOF'
          import numpy as np
          import jax
          from sci_reward.rewards.bioactivity import BioactivityReward, BioactivityRewardTrainer

          PAIRS = [("CCO", "CCN")] * 16 + [("c1ccccc1", "CCCC")] * 16

          def run():
              reward = BioactivityReward(hidden_dim=32, n_layers=1).initialize(
                  jax.random.PRNGKey(0)
              )
              trainer = BioactivityRewardTrainer(reward, learning_rate=1e-3)
              losses = trainer.train(PAIRS, n_epochs=3, batch_size=8, verbose=False)
              scores = [reward.score(s) for s, _ in PAIRS[:4]]
              return losses, scores

          l1, s1 = run()
          l2, s2 = run()

          for i, (a, b) in enumerate(zip(l1, l2)):
              assert abs(a - b) < 1e-6, f"Non-deterministic loss at epoch {i}: {a} vs {b}"
          for i, (a, b) in enumerate(zip(s1, s2)):
              assert abs(a - b) < 1e-6, f"Non-deterministic score at index {i}: {a} vs {b}"

          before = np.random.get_state()[1][0]
          run()
          after = np.random.get_state()[1][0]
          assert before == after, "Training must not mutate the global numpy rng state"
          print("PASS: training is fully deterministic and global numpy rng is unchanged")
          PYEOF

      - name: PreferenceDataset.iter_batches is seed-stable and seed-sensitive
        env:
          JAX_PLATFORM_NAME: cpu
          PYTHONHASHSEED: "0"
        run: |
          python - <<'PYEOF'
          import numpy as np
          from sci_reward.training.reward_trainer import PreferenceDataset

          pairs = [
              ("CCO", "CCN"), ("c1ccccc1", "CCCC"), ("CC(=O)O", "CCN"),
              ("Cc1ccccc1", "CCO"), ("CC(C)O", "c1ccccc1"), ("CCC", "CC(=O)O"),
              ("CC(C)C", "CCO"), ("c1ccncc1", "CCC"), ("CC(=O)N", "Cc1ccccc1"),
              ("CCCO", "CC(C)O"), ("c1cccnc1", "CC(=O)N"), ("CC(O)C", "CCCO"),
          ] * 2
          ds = PreferenceDataset(pairs)

          def collect(seed):
              return [np.array(c) for c, _ in ds.iter_batches(batch_size=8, shuffle=True, seed=seed)]

          r1, r2, r3 = collect(42), collect(42), collect(99)
          for a, b in zip(r1, r2):
              np.testing.assert_array_equal(a, b)
          assert not all(np.array_equal(a, b) for a, b in zip(r1, r3)), \
              "Different seeds must produce different batch orderings"
          print("PASS: iter_batches is seed-stable and seed-sensitive")
          PYEOF

      - name: RunningStats Welford matches numpy batch statistics
        env:
          JAX_PLATFORM_NAME: cpu
          PYTHONHASHSEED: "0"
        run: |
          python - <<'PYEOF'
          import numpy as np
          from sci_reward.training.calibration import RunningStats

          rng = np.random.default_rng(0)
          vals = rng.random(200).tolist()

          s = RunningStats()
          for chunk in [vals[:50], vals[50:120], vals[120:]]:
              s.update(chunk)

          np_mean = float(np.mean(vals))
          np_var  = float(np.var(vals, ddof=1))
          assert abs(s.mean - np_mean) < 1e-9, f"mean: {s.mean} vs {np_mean}"
          assert abs(s.variance - np_var) < 1e-7, f"variance: {s.variance} vs {np_var}"
          print(f"PASS: Welford mean={s.mean:.10f}  numpy={np_mean:.10f}")
          PYEOF
